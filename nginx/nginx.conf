# Nginx 站点配置（挂载到 /etc/nginx/conf.d/default.conf）
# 职责：前端 SPA 托管 + /api 反代 FastAPI（SSE 关闭缓冲）

server {
    listen 80;
    client_max_body_size 10m;

    # 前端 SPA：路由 404 回退到 index.html（vue-router history 模式）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 健康检查直通（/health 注册在 FastAPI 根路径，不在 /api 前缀内）
    location = /health {
        proxy_pass http://api:8000;
    }

    # API 反代到 FastAPI 容器（compose 网络内通过服务名解析）
    location /api {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 流式（/api/ai/chat）必须关闭代理缓冲，否则打字机效果失效
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
